<div class="app-shell">
  @if (auth.estaAutenticado) {
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="Finx, início">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span>finx</span>
    </a>

    <span class="nav-heading">MENU</span>
    <nav aria-label="Menu principal">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>Dashboard</span>
      </a>
      <a
        class="nav-link"
        routerLink="/movimentacao-financeira"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>Cadastrar movimentação</span>
      </a>
      <a
        class="nav-link"
        routerLink="/consulta-movimentacoes"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon" aria-hidden="true">↗</span>
        <span>Consultar movimentações</span>
      </a>
      <a
        class="nav-link"
        routerLink="/cadastro-categoria"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        <span class="nav-icon" aria-hidden="true">＋</span>
        <span>Cadastrar categoria</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="user-identity">Logado como <strong>{{ auth.nomeUsuario }}</strong></span>
      <button class="logout-button" type="button" (click)="sair()" aria-label="Sair da conta">Sair</button>
    </div>
  </aside>
  }

  <div class="main-content" [class.main-content-auth]="!auth.estaAutenticado">
    <router-outlet></router-outlet>
  </div>
</div>
