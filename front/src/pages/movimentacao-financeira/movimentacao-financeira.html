<main class="page">
  <section class="card" aria-labelledby="page-title">
    <header class="card-header">
      <span class="eyebrow">FINANÇAS</span>
      <h1 id="page-title">Nova movimentação</h1>
      <p>Preencha os dados para registrar uma entrada ou saída.</p>
    </header>

    <form #form="ngForm" (ngSubmit)="salvar(form)">
      <div class="field">
        <label for="descricao">Descrição</label>
        <input
          id="descricao"
          name="descricao"
          type="text"
          placeholder="Ex.: Conta de energia"
          [(ngModel)]="movimentacao.descricao"
          required
        />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="data">Data</label>
          <input
            id="data"
            name="data"
            type="date"
            [(ngModel)]="movimentacao.data"
            required
          />
        </div>
        <div class="field">
          <label for="valor">Valor (R$)</label>
          <input
            id="valor"
            name="valor"
            type="number"
            step="0.01"
            placeholder="0,00"
            [(ngModel)]="movimentacao.valor"
            required
          />
        </div>
      </div>

      <div class="field">
        <label for="categoria">Categoria</label>
        <select
          id="categoria"
          name="categoria"
          [(ngModel)]="movimentacao.categoria"
          required
          [disabled]="carregandoCategorias || categorias.length === 0"
        >
          <option [ngValue]="null" disabled>
            {{ carregandoCategorias ? 'Carregando categorias...' : 'Selecione uma categoria' }}
          </option>
          <option *ngFor="let categoria of categorias" [ngValue]="categoria">
            {{ categoria.nome }}
          </option>
        </select>
        <small *ngIf="categoriaErro" role="alert">{{ categoriaErro }}</small>
        <small *ngIf="!carregandoCategorias && !categoriaErro && categorias.length === 0">
          Cadastre uma categoria antes de registrar movimentações.
        </small>
      </div>

      <p
        class="feedback"
        [class.feedback-error]="erro"
        role="status"
        aria-live="polite"
        *ngIf="mensagem"
      >
        {{ mensagem }}
      </p>

      <button type="submit" [disabled]="form.invalid || enviando">
        {{ enviando ? 'Salvando...' : 'Salvar movimentação' }}
      </button>
    </form>
  </section>
</main>
